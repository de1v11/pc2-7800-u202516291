spring.application.name=AndesLogistic

server.port=8080
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/delivery?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PASSWORD:123456}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
